name: Verify runtime and distributions
on: [push, pull_request]
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s dev/tests
      - run: python dev/scripts/validate_project.py
      - run: python dev/tools/build_release.py --output dev/artifacts/native.zip
      - run: python dev/tools/build_release.py --output dev/artifacts/json.zip --template-mode json
