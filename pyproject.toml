[project]
name = "word-format-master"
version = "1.4.0"
description = "Deterministic Word (.docx) thesis and report generation, formatting, and verification engine"
requires-python = ">=3.10"
dependencies = [
    "python-docx>=1.1.0",
    "lxml>=5.0.0",
    "pypdf>=4.0.0",
    "pypdfium2>=4.20.0",
]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["scripts", "dev/tests", "dev/scripts", "dev/tools"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "I"]
ignore = ["B008"]

[tool.ruff.lint.per-file-ignores]
"scripts/cover_template.py" = ["E402", "F401"]
"dev/tests/*.py" = ["E402"]
"dev/scripts/*.py" = ["E402"]
"dev/tools/*.py" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["dev/tests"]
pythonpath = ["scripts"]
